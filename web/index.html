<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Jotpot - বাংলাদেশের সকল জেলার ভাড়ায় চালিত গাড়ির ডিরেক্টরি">
  <meta name="theme-color" content="#FF6B00">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Jotpot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jotpot - ভাড়ায় চালিত গাড়ির ডিরেক্টরি</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Web Initial Loading Screen with Car Icon -->
  <div id="loading-splash" style="position: fixed; inset: 0; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999999; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <img src="splash_logo.png" alt="Jotpot Car" style="width: 140px; height: auto; margin-bottom: 18px; object-fit: contain; animation: jotpotPulse 1.8s infinite ease-in-out;" />
    <div style="font-size: 36px; font-weight: 900; letter-spacing: 1.2px; margin-bottom: 6px;">
      <span style="color: #000000;">JOT</span><span style="color: #FF6B00;">POT</span>
    </div>
    <div style="font-size: 15px; font-weight: 600; color: #64748B; margin-bottom: 32px; letter-spacing: 0.3px;">ভাড়ায় চালিত গাড়ির ডিরেক্টরি</div>
    <div style="width: 38px; height: 38px; border: 3.5px solid #FFF2E8; border-top-color: #FF6B00; border-radius: 50%; animation: jotpotSpin 0.8s linear infinite;"></div>
  </div>
  <style>
    @keyframes jotpotSpin { to { transform: rotate(360deg); } }
    @keyframes jotpotPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.92; } }
  </style>
  <script>
    // Remove loading splash once Flutter first frame is drawn
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.transition = 'opacity 0.3s ease-out';
        splash.style.opacity = '0';
        setTimeout(function() { splash.remove(); }, 300);
      }
    });

    // Automatically purge old offline cache and service workers so all updates show immediately
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
